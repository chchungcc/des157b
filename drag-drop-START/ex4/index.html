<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Drag and Drop Examples</title>
    <link href="styles.css" rel="stylesheet">

    <!-- JQuery Library -->
    <script 
        src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
        crossorigin="anonymous" defer>
    </script>

    <!-- jQuery UI -->
    <script 
        src="https://code.jquery.com/ui/1.14.2/jquery-ui.min.js" 
        integrity="sha256-mblSWfbYzaq/f+4akyMhE6XELCou4jbkgPv+JQPER2M=" crossorigin="anonymous" defer>
    </script>

    <!-- Your script here -->
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Drag and Drop the Cat and The Dog to the Correct Locations</h1>
    <div id="parent">
        <div id="cat-drop">Cat goes here</div><div id="dog-drop">Dog goes here</div>
        <img src="images/dog.jpg" alt="dog" id="dog">
        <img src="images/cat.jpg" alt="cat" id="cat">
    </div>

</body>
</html>
