<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Liberty</title>

    <!-- normalization -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:wght@300..700&display=swap" rel="stylesheet">
    
    <!-- style sheet -->
    <link href="styles.css" rel="stylesheet">

    <!-- granim.js -->
    <script src="granim.min.js" defer></script>

    <!-- gsap -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" defer></script>

    <!-- gsap split text -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js" defer></script>

    <!-- jquery library-->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous" defer></script>

    <!-- jquery ui -->
    <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.min.js" integrity="sha256-mblSWfbYzaq/f+4akyMhE6XELCou4jbkgPv+JQPER2M=" crossorigin="anonymous" defer></script>


    <!-- javascript -->
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <div id="animated-ticket">
            <canvas id="granim-ticket"></canvas>
            <img src="images/sp-ticket.png" alt="spring" id="ticket" width="700">
        </div>

        <p class="text">drag the characters</p>


        <div id="character1">
            <canvas id="granim-character1"></canvas>
            <div id="block1"></div>
        </div>

        <div id="character2">
            <canvas id="granim-character2"></canvas>
            <div id="block2"></div>
        </div>

        <div id="character3">
            <canvas id="granim-character3"></canvas>
            <div id="block3"></div>
        </div>

        <div id="character4">
            <canvas id="granim-character4"></canvas>
            <div id="block4"></div>
        </div>

        <div id="character5">
            <canvas id="granim-character5"></canvas>
            <div id="block5"></div>
        </div>

        <div id="character6">
            <canvas id="granim-character6"></canvas>
            <div id="block6"></div>
        </div>
    </main>
</body>
</html>
